<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>ESP32 Smart Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body {
  margin: 0;
  background: linear-gradient(135deg,#1d2671,#c33764);
  color: white;
  text-align: center;
}

h1 { margin-top: 25px; font-weight: 600; }

.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

#loginForm {
  max-width: 380px;
  margin: 80px auto;
  padding: 30px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  border: none;
  outline: none;
}

button {
  padding: 12px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: 0.3s;
}

button:hover { transform: scale(1.05); }

#loginBtn { width:100%; background:#00c6ff; color:white; }

#dashboard { display:none; }

select {
  padding: 10px;
  border-radius: 12px;
  border:none;
  margin: 20px 0;
}

.relay-container {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.relay-card {
  width:220px;
  padding:20px;
  margin:15px;
}

.status-badge {
  padding:6px 12px;
  border-radius:50px;
  font-weight:600;
  font-size:14px;
}

.on { background:#00e676; color:black; }
.off { background:#ff5252; }

.control-btn {
  margin-top:12px;
  width:100%;
  background:#2196f3;
  color:white;
}

#allOffBtn { background:#ff1744; margin:20px; }
#logoutBtn { background:#607d8b; margin:20px; }

@media(max-width:600px){
  .relay-card{ width:90%; }
}
</style>
</head>

<body>

<h1>⚡ ESP32 Smart Dashboard</h1>

<div id="loginForm" class="glass">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<div id="dashboard">
  <select id="deviceSelect"></select>

  <div class="relay-container">
    <div class="relay-card glass">
      <h3>Relay 1</h3>
      <span id="status1" class="status-badge off">OFF</span>
      <button id="btn1" class="control-btn">Toggle</button>
    </div>

    <div class="relay-card glass">
      <h3>Relay 2</h3>
      <span id="status2" class="status-badge off">OFF</span>
      <button id="btn2" class="control-btn">Toggle</button>
    </div>

    <div class="relay-card glass">
      <h3>Relay 3</h3>
      <span id="status3" class="status-badge off">OFF</span>
      <button id="btn3" class="control-btn">Toggle</button>
    </div>

    <div class="relay-card glass">
      <h3>Relay 4</h3>
      <span id="status4" class="status-badge off">OFF</span>
      <button id="btn4" class="control-btn">Toggle</button>
    </div>
  </div>

  <button id="allOffBtn">All OFF</button>
  <button id="logoutBtn">Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAZ1F0MI0V_5H3_j9oQCSy16vqHjzTwNbo",
  authDomain: "saikat-esp32.firebaseapp.com",
  databaseURL: "https://saikat-esp32-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "saikat-esp32",
});

loginBtn.onclick = () => {
  firebase.auth().signInWithEmailAndPassword(email.value,password.value)
  .then(()=>{
    loginForm.style.display="none";
    dashboard.style.display="block";
    initDashboard();
  }).catch(e=>alert(e.message));
};

function initDashboard(){
  const db=firebase.database();
  const uid=firebase.auth().currentUser.uid;
  const relays=[1,2,3,4];

  db.ref(`users/${uid}/devices`).on("value",snap=>{
    deviceSelect.innerHTML="";
    snap.forEach(c=>{
      deviceSelect.innerHTML+=`<option>${c.key}</option>`;
    });
    if(deviceSelect.value) loadDevice(deviceSelect.value);
  });

  deviceSelect.onchange=()=>loadDevice(deviceSelect.value);

  function loadDevice(deviceID){
    relays.forEach(i=>{
      const ref=db.ref(`users/${uid}/devices/${deviceID}/relay${i}`);
      const status=document.getElementById(`status${i}`);
      const btn=document.getElementById(`btn${i}`);

      ref.on("value",s=>{
        const state=s.val();
        status.textContent=state?"ON":"OFF";
        status.className="status-badge "+(state?"on":"off");
      });

      btn.onclick=()=>ref.get().then(s=>ref.set(!s.val()));
    });

    allOffBtn.onclick=()=>relays.forEach(i=>
      db.ref(`users/${uid}/devices/${deviceID}/relay${i}`).set(false)
    );
  }
}

logoutBtn.onclick=()=>firebase.auth().signOut().then(()=>{
  dashboard.style.display="none";
  loginForm.style.display="block";
});
</script>
</body>
</html>
