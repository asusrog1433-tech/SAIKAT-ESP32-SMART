<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Smart Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Poppins}
body{
  margin:0;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
}

h1{text-align:center;margin:25px 10px;font-weight:600}

.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:none}
}

/* ===== LOGIN ===== */
#loginForm{
  max-width:380px;
  margin:100px auto;
  padding:30px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:15px;
}

button{
  background:#00c6ff;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}
button:hover{transform:scale(1.05)}

/* ===== DASHBOARD ===== */
#dashboard{display:none;padding:20px}

.top-bar{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-bottom:25px;
}

.status{
  padding:8px 18px;
  border-radius:30px;
  font-weight:600;
}
.online{background:#00e676;color:black}
.offline{background:#ff5252}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  padding:20px;
  text-align:center;
}

.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  font-weight:600;
  margin:10px 0;
}
.on{background:#00e676;color:black}
.off{background:#ff5252}

.sensor{
  font-size:22px;
  font-weight:600;
}

/* ===== ACTIONS ===== */
.actions{
  margin-top:30px;
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
}
.red{background:#ff1744;color:white}
.gray{background:#607d8b;color:white}

/* ===== MOBILE ===== */
@media(max-width:500px){
  h1{font-size:22px}
}
</style>
</head>

<body>

<h1>⚡ ESP32 Smart Home</h1>

<!-- ===== LOGIN ===== -->
<div id="loginForm" class="glass">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard">

  <div class="top-bar">
    <select id="deviceSelect"></select>
    <span id="onlineStatus" class="status offline">Offline</span>
  </div>

  <!-- RELAYS -->
  <div id="relayGrid" class="grid"></div>

  <!-- SENSORS -->
  <div class="grid" style="margin-top:25px">
    <div class="card glass">
      <h3>🌡 Temperature</h3>
      <div id="temp" class="sensor">-- °C</div>
    </div>
    <div class="card glass">
      <h3>💧 Humidity</h3>
      <div id="hum" class="sensor">-- %</div>
    </div>
    <div class="card glass">
      <h3>🔥 Gas</h3>
      <div id="gas" class="sensor">--</div>
    </div>
  </div>

  <div class="actions">
    <button id="allOn">All ON</button>
    <button id="allOff" class="red">All OFF</button>
    <button id="logout" class="gray">Logout</button>
  </div>
</div>

<!-- ===== FIREBASE ===== -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAZ1F0MI0V_5H3_j9oQCSy16vqHjzTwNbo",
  authDomain:"saikat-esp32.firebaseapp.com",
  databaseURL:"https://saikat-esp32-default-rtdb.europe-west1.firebasedatabase.app"
});

/* ===== LOGIN ===== */
loginBtn.onclick = () => {
  firebase.auth()
    .signInWithEmailAndPassword(email.value, password.value)
    .then(() => {
      loginForm.style.display="none";
      dashboard.style.display="block";
      initDashboard();
    })
    .catch(e => alert(e.message));
};

/* ===== DASHBOARD ===== */
function initDashboard(){
  const db = firebase.database();
  const uid = firebase.auth().currentUser.uid;
  const relayCount = 16;

  // Load devices
  db.ref(`users/${uid}/devices`).on("value", snap => {
    deviceSelect.innerHTML = "";
    snap.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.key;
      opt.textContent = c.key;
      deviceSelect.appendChild(opt);
    });

    if(deviceSelect.options.length > 0){
      deviceSelect.selectedIndex = 0;
      loadDevice(deviceSelect.value);
    }
  });

  deviceSelect.onchange = () => loadDevice(deviceSelect.value);

  function loadDevice(deviceID){
    relayGrid.innerHTML = "";

    // RELAYS
    for(let i=1;i<=relayCount;i++){
      relayGrid.innerHTML += `
        <div class="card glass">
          <h3>Relay ${i}</h3>
          <span id="st${i}" class="badge off">OFF</span>
          <button onclick="toggleRelay('${deviceID}',${i})">Toggle</button>
        </div>
      `;

      db.ref(`users/${uid}/devices/${deviceID}/relay${i}`)
        .on("value", s => {
          const st = document.getElementById(`st${i}`);
          if(!st) return;
          st.textContent = s.val() ? "ON" : "OFF";
          st.className = "badge " + (s.val() ? "on" : "off");
        });
    }

    // STATUS
    db.ref(`users/${uid}/devices/${deviceID}/online`)
      .on("value", v => {
        onlineStatus.textContent = v.val() ? "Online" : "Offline";
        onlineStatus.className = "status " + (v.val()?"online":"offline");
      });

    // SENSORS
    db.ref(`users/${uid}/devices/${deviceID}/temperature`)
      .on("value", v => temp.textContent = (v.val() ?? "--") + " °C");

    db.ref(`users/${uid}/devices/${deviceID}/humidity`)
      .on("value", v => hum.textContent = (v.val() ?? "--") + " %");

    db.ref(`users/${uid}/devices/${deviceID}/gasValue`)
      .on("value", v => gas.textContent = v.val() ?? "--");
  }

  window.toggleRelay = (deviceID, relay) => {
    const ref = db.ref(`users/${uid}/devices/${deviceID}/relay${relay}`);
    ref.get().then(s => ref.set(!s.val()));
  };

  allOn.onclick = () => bulk(true);
  allOff.onclick = () => bulk(false);

  function bulk(val){
    const d = deviceSelect.value;
    for(let i=1;i<=relayCount;i++){
      db.ref(`users/${uid}/devices/${d}/relay${i}`).set(val);
    }
  }
}

/* ===== LOGOUT ===== */
logout.onclick = () => {
  firebase.auth().signOut().then(() => {
    dashboard.style.display="none";
    loginForm.style.display="block";
  });
};
</script>

</body>
</html>
